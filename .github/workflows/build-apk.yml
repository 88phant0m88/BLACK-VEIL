name: Build BLACK VEIL APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"
  OUTPUT_NAME: "BLACK_VEIL_debug.apk"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl xvfb libgl1 mesa-utils
          
      - name: Find correct Godot download URL
        id: find_godot
        run: |
          # Try TuxFamily mirror first (more reliable)
          BASE_URL="https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}.stable/"
          
          # Try headless binary
          for SUFFIX in "linux_headless.x86_64.zip" "linux.x86_64.zip"; do
            URL="${BASE_URL}Godot_v${GODOT_VERSION}.stable_${SUFFIX}"
            echo "Testing: $URL"
            if wget -q --spider "$URL" 2>/dev/null; then
              echo "GODOT_URL=$URL" >> $GITHUB_OUTPUT
              echo "FOUND: $URL"
              break
            fi
          done
          
          # Fallback: try GitHub releases API
          if [ -z "$GODOT_URL" ]; then
            echo "Trying GitHub API..."
            API_URL="https://api.github.com/repos/godotengine/godot-builds/releases/tags/${GODOT_VERSION}.stable"
            URL=$(curl -s "$API_URL" | grep -o 'https://[^"]*linux_headless[^"]*\.zip' | head -1)
            if [ -n "$URL" ]; then
              echo "GODOT_URL=$URL" >> $GITHUB_OUTPUT
              echo "FOUND via API: $URL"
            fi
          fi
          
      - name: Download Godot
        if: steps.find_godot.outputs.GODOT_URL != ''
        run: |
          wget -q "${{ steps.find_godot.outputs.GODOT_URL }}" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}.stable_linux_headless.x86_64 2>/dev/null || chmod +x Godot_v${GODOT_VERSION}.stable_linux.x86_64 2>/dev/null || true
          ls -la Godot* 2>/dev/null || echo "Godot binary not found"
          
      - name: Download Android export templates
        run: |
          BASE_URL="https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}.stable/"
          URL="${BASE_URL}Godot_v${GODOT_VERSION}.stable_export_templates.tpz"
          echo "Downloading templates: $URL"
          wget -q "$URL" -O export_templates.tpz || { echo "FAILED to download templates"; exit 1; }
          mkdir -p ~/.local/share/godot/export_templates
          unzip -o export_templates.tpz -d ~/.local/share/godot/export_templates/
          ls -la ~/.local/share/godot/export_templates/
          
      - name: Create export preset config
        run: |
          cat > export_presets.cfg << 'ENDCFG'
          [export_preset_data "Android Debug"]
          target="TemplateDebug"
          timeout=300
          stripped=false
          
          [export_preset_data "TemplateDebug"]
          pck="export_debug.pck"
          all=true
          path=""
          target_class=4
          target="Debug"
          export_gdextensions=true
          strip_engine_symbols=false
          strip_translation_po=false
          enable_blob_compression=true
          android_apk="export_debug.apk"
          android_min_sdk=21
          android_target_sdk=34
          android_ndk_api=21
          ENDCFG
          cat export_presets.cfg
          
      - name: Export Android APK
        run: |
          mkdir -p build
          if [ -f "Godot_v${GODOT_VERSION}.stable_linux_headless.x86_64" ]; then
            GODOT_BIN="Godot_v${GODOT_VERSION}.stable_linux_headless.x86_64"
          elif [ -f "Godot_v${GODOT_VERSION}.stable_linux.x86_64" ]; then
            GODOT_BIN="Godot_v${GODOT_VERSION}.stable_linux.x86_64"
          else
            echo "Godot binary not found!"
            exit 1
          fi
          chmod +x $GODOT_BIN
          $GODOT_BIN --headless --verbose --export-debug "Android Debug" build/${OUTPUT_NAME} 2>&1 || true
          ls -la build/ 2>/dev/null || echo "Build directory empty"
          file build/${OUTPUT_NAME} 2>/dev/null || echo "APK file not found"
          
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACK_VEIL_APK
          path: build/${OUTPUT_NAME}
          retention-days: 7
